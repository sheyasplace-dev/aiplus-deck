<title>AI+ — Sponsor Prospectus 2026</title>
<style>
  /* ============================================================
     TOKENS — light is primary. Dark is a considered variant.
     Palette: white ground, near-black ink with slight blue bias,
     one electric blue accent used with restraint.
     ============================================================ */
  :root {
    --bg: #FFFFFF;
    --bg-2: #F7F8FB;
    --ink: #0A0A0F;

    --accent: #1652F0;
    --accent-hover: #0B3ED9;
    --accent-soft: #EDF2FF;
    --accent-ink: #0B2F99;
    --shadow-sm: 0 1px 2px rgba(10,10,15,0.04);
    --shadow-md: 0 12px 32px -12px rgba(22,82,240,0.18);
    --shadow-lg: 0 40px 80px -40px rgba(22,82,240,0.25);
    --radius-sm: 6px;
    --radius-md: 14px;
    --radius-lg: 22px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0A0A10;
      --bg-2: #0F1017;
      --ink: #FFFFFF;
      --ink-2: #E5E7EB;
      --muted: #9CA3AF;
      --muted-2: #6B7280;
      --rule: #1E1F27;
      --rule-soft: #14151C;
      --tint: #111629;
      --accent: #5B85FF;
      --accent-hover: #7A9CFF;
      --accent-soft: #101A34;
      --accent-ink: #A9C0FF;
      --shadow-md: 0 12px 32px -12px rgba(91,133,255,0.28);
      --shadow-lg: 0 40px 80px -40px rgba(91,133,255,0.35);
    }
  }

  :root[data-theme="light"] {
    --bg: #FFFFFF;
    --bg-2: #F7F8FB;
    --ink: #0A0A0F;
    --ink-2: #1A1D28;
    --muted: #5A5F6B;
    --muted-2: #8E93A0;
    --rule: #E8E8ED;
    --rule-soft: #F1F2F5;
    --tint: #F1F5FF;
    --accent: #1652F0;
    --accent-hover: #0B3ED9;
    --accent-soft: #EDF2FF;
    --accent-ink: #0B2F99;
  }

  :root[data-theme="dark"] {
    --bg: #0A0A10;
    --bg-2: #0F1017;
    --ink: #FFFFFF;
    --ink-2: #E5E7EB;
    --muted: #9CA3AF;
    --muted-2: #6B7280;
    --rule: #1E1F27;
    --rule-soft: #14151C;
    --tint: #111629;
    --accent: #5B85FF;
    --accent-hover: #7A9CFF;
    --accent-soft: #101A34;
    --accent-ink: #A9C0FF;
  }

  /* ============================================================
     BASE
     ============================================================ */
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    cursor: none;
  }
  @media (hover: none) {
    body { cursor: auto; }
  }
  * { box-sizing: border-box; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: none; }
  @media (hover: none) {
    button, a { cursor: pointer !important; }
  }
  img { max-width: 100%; display: block; }
  ::selection { background: var(--accent); color: #fff; }

  /* ============================================================
     CUSTOM CURSOR
     ============================================================ */
  .cursor-dot, .cursor-ring {
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-100px, -100px);
    will-change: transform;
    mix-blend-mode: difference;
  }
  .cursor-dot {
    width: 8px; height: 8px;
    background: #fff;
    border-radius: 50%;
    margin: -4px 0 0 -4px;
  }
  .cursor-ring {
    width: 36px; height: 36px;
    border: 1px solid #fff;
    border-radius: 50%;
    margin: -18px 0 0 -18px;
    transition: width .25s cubic-bezier(.4,.2,.2,1), height .25s cubic-bezier(.4,.2,.2,1), margin .25s cubic-bezier(.4,.2,.2,1), background .2s;
  }
  .cursor-ring.hover {
    width: 68px; height: 68px;
    margin: -34px 0 0 -34px;
    background: rgba(255,255,255,.08);
  }
  @media (hover: none) {
    .cursor-dot, .cursor-ring { display: none; }
  }

  /* ============================================================
     TOP NAV
     ============================================================ */
  #topnav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    background: transparent;
    transition: padding .3s, background .3s, backdrop-filter .3s, border-color .3s;
    border-bottom: 1px solid transparent;
  }
  #topnav.scrolled {
    padding: 12px 32px;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: saturate(140%) blur(14px);
    -webkit-backdrop-filter: saturate(140%) blur(14px);
    border-bottom-color: var(--rule);
  }
  .brand-mark {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.02em;
  }
  .brand-mark .plus {
    color: var(--accent);
    font-weight: 800;
  }
  .brand-mark .meta {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: 14px;
    border-left: 1px solid var(--rule);
    margin-left: 6px;
  }
  .nav-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .nav-link {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 14px;
    border-radius: 999px;
    transition: color .2s, background .2s;
  }
  .nav-link:hover { color: var(--ink); background: var(--rule-soft); }
  .theme-toggle {
    background: none;
    border: 1px solid var(--rule);
    border-radius: 999px;
    width: 34px; height: 34px;
    display: grid;
    place-items: center;
    color: var(--muted);
    transition: color .2s, border-color .2s;
  }
  .theme-toggle:hover { color: var(--ink); border-color: var(--muted); }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    background: var(--accent);
    color: #fff;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: -0.005em;
    border-radius: 999px;
    border: none;
    transition: background .2s, transform .2s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn.small { padding: 8px 14px; font-size: 13px; }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--rule);
  }
  .btn.ghost:hover { border-color: var(--ink); background: transparent; }
  .btn .arr { transition: transform .25s; }
  .btn:hover .arr { transform: translateX(3px); }

  /* ============================================================
     SIDE INDEX
     ============================================================ */
  #sideindex {
    position: fixed;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 90;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-end;
  }
  .idx-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted-2);
    transition: color .25s;
  }
  .idx-item .idx-label { opacity: 0; transform: translateX(6px); transition: opacity .25s, transform .25s; }
  .idx-item:hover .idx-label { opacity: 1; transform: translateX(0); }
  .idx-item.active { color: var(--ink); }
  .idx-item.active .idx-label { opacity: 1; transform: translateX(0); }
  .idx-tick {
    width: 22px; height: 1px;
    background: var(--muted-2);
    transition: width .25s, background .25s;
  }
  .idx-item.active .idx-tick,
  .idx-item:hover .idx-tick { width: 44px; background: var(--accent); }
  @media (max-width: 900px) {
    #sideindex { display: none; }
  }

  /* ============================================================
     LAYOUT
     ============================================================ */
  main { display: block; overflow: hidden; }
  .section {
    position: relative;
    padding: 140px 32px;
  }
  .wrap {
    max-width: 1240px;
    margin: 0 auto;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before {
    content: '';
    width: 22px; height: 1px;
    background: var(--accent);
  }
  .section-head {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    margin-bottom: 80px;
    align-items: end;
  }
  @media (max-width: 780px) {
    .section-head { grid-template-columns: 1fr; gap: 24px; margin-bottom: 48px; }
    .section { padding: 100px 22px; }
  }
  h1, h2, h3, h4 {
    margin: 0;
    letter-spacing: -0.035em;
    font-weight: 600;
    text-wrap: balance;
    line-height: 0.98;
    font-family: var(--sans);
  }
  h1 { font-size: clamp(56px, 9vw, 132px); letter-spacing: -0.045em; font-weight: 600; }
  h2 { font-size: clamp(40px, 6vw, 88px); font-weight: 600; }
  h3 { font-size: clamp(22px, 2.4vw, 32px); letter-spacing: -0.025em; }
  h4 { font-size: 15px; letter-spacing: -0.005em; text-transform: none; }
  p { margin: 0; line-height: 1.55; }
  .lead {
    font-size: clamp(17px, 1.4vw, 20px);
    color: var(--muted);
    max-width: 52ch;
    text-wrap: pretty;
  }

  /* ============================================================
     HERO
     ============================================================ */
  #hero {
    min-height: 100vh;
    padding: 120px 32px 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .hero-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(1200px 800px at var(--mx, 60%) var(--my, 30%), var(--accent-soft), transparent 60%),
      radial-gradient(900px 700px at 10% 90%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 65%);
    z-index: 0;
    transition: background .3s;
    pointer-events: none;
  }
  .hero-inner {
    position: relative;
    z-index: 1;
    max-width: 1240px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 80px;
    flex-grow: 1;
    justify-content: space-between;
  }
  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
    padding-top: 40px;
  }
  .hero-headline {
    display: block;
  }
  .hero-headline .line {
    display: block;
    overflow: hidden;
  }
  .hero-headline .line span {
    display: inline-block;
    transform: translateY(105%);
    animation: rise 1s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .hero-headline .line:nth-child(2) span { animation-delay: .12s; }
  .hero-headline .line:nth-child(3) span { animation-delay: .24s; }
  .hero-headline .accent { color: var(--accent); font-style: italic; font-family: "Iowan Old Style", "Palatino", ui-serif, Georgia, serif; font-weight: 500; letter-spacing: -0.03em; }
  @keyframes rise { to { transform: translateY(0); } }

  .hero-foot {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 60px;
    align-items: end;
    padding-bottom: 20px;
  }
  @media (max-width: 780px) {
    .hero-foot { grid-template-columns: 1fr; gap: 32px; }
    .hero-top { flex-direction: column; align-items: flex-start; gap: 10px; }
  }
  .hero-sub {
    font-size: clamp(16px, 1.3vw, 20px);
    color: var(--muted);
    max-width: 44ch;
    text-wrap: pretty;
  }
  .hero-ministats {
    display: flex;
    gap: 48px;
    padding: 24px 0;
    border-top: 1px solid var(--rule);
  }
  .hero-ministats > div { display: flex; flex-direction: column; gap: 6px; }
  .hero-ministats .v { font-size: 32px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .hero-ministats .l { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  .scroll-hint {
    position: absolute;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex; align-items: center; gap: 10px;
    z-index: 2;
    animation: fadein 1.4s .6s both;
  }
  .scroll-hint::after {
    content: '';
    width: 1px; height: 32px;
    background: linear-gradient(var(--accent), transparent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .3; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* ============================================================
     PROOF STRIP
     ============================================================ */
  #proof { padding: 100px 32px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .proof-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    max-width: 1240px;
    margin: 0 auto;
  }
  @media (max-width: 900px) { .proof-grid { grid-template-columns: repeat(2, 1fr); } }
  .proof-cell {
    padding: 30px 30px;
    border-right: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .proof-cell:last-child { border-right: none; }
  @media (max-width: 900px) {
    .proof-cell:nth-child(2n) { border-right: none; }
    .proof-cell { border-bottom: 1px solid var(--rule); }
    .proof-cell:nth-last-child(-n+2) { border-bottom: none; }
  }
  .proof-cell .v {
    font-size: clamp(38px, 5vw, 64px);
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .proof-cell .l {
    font-size: 15px;
    color: var(--ink);
    font-weight: 500;
    margin-top: 8px;
  }
  .proof-cell .n {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-top: 2px;
  }

  /* ============================================================
     AUDIENCE — pinned crossfade
     ============================================================ */
  .pin-wrap { position: relative; }
  .pin-inner {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #audience-pin { padding: 120px 32px 60px; }
  .aud-head {
    max-width: 1240px;
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    padding-bottom: 40px;
  }
  @media (max-width: 780px) { .aud-head { grid-template-columns: 1fr; gap: 20px; padding-bottom: 20px; } }
  .aud-body {
    max-width: 1240px;
    margin: 0 auto;
    width: 100%;
    flex-grow: 1;
    position: relative;
  }
  .aud-state {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity .5s cubic-bezier(.4,.2,.2,1);
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
  }
  .aud-state.active { opacity: 1; pointer-events: auto; }
  .aud-state-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
    padding-bottom: 10px;
    flex-wrap: wrap;
  }
  .aud-state-head h3 { font-size: clamp(28px, 3vw, 42px); font-weight: 600; letter-spacing: -0.03em; }
  .aud-state-head .n { font-family: var(--mono); font-size: 12px; color: var(--muted); max-width: 40ch; text-align: right; }
  @media (max-width: 780px) { .aud-state-head .n { text-align: left; } }
  .bar-stack {
    display: flex;
    height: 88px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--rule-soft);
  }
  .bar-seg {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 0 18px;
    color: #fff;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    width: 0;
    transition: width 1.1s cubic-bezier(.2,.7,.2,1);
    overflow: hidden;
    white-space: nowrap;
    position: relative;
  }
  .aud-state.active .bar-seg { width: var(--w); }
  .bar-seg .pct { font-weight: 600; }
  .bar-seg .lbl { opacity: .95; margin-left: 8px; }
  .bar-legend {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px 24px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
  }
  .bar-legend .li {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: var(--ink);
  }
  .bar-legend .sw {
    width: 10px; height: 10px; border-radius: 2px;
  }
  .bar-legend .pc {
    font-family: var(--mono);
    color: var(--muted);
    margin-left: auto;
    font-size: 12px;
  }
  .aud-state-tabs {
    display: flex;
    gap: 8px;
    margin-top: 32px;
  }
  .aud-tab {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 8px 14px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: transparent;
    transition: all .2s;
  }
  .aud-tab.active {
    color: #fff;
    background: var(--ink);
    border-color: var(--ink);
  }

  /* ============================================================
     SPEAKERS — marquee + grid
     ============================================================ */
  .marquee {
    overflow: hidden;
    padding: 40px 0 20px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    margin-bottom: 80px;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
    mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
  }
  .marquee-track {
    display: flex;
    gap: 60px;
    width: max-content;
    animation: marquee 60s linear infinite;
    align-items: center;
  }
  .marquee-track span {
    font-size: clamp(48px, 6vw, 96px);
    font-weight: 600;
    letter-spacing: -0.035em;
    color: var(--ink);
    white-space: nowrap;
  }
  .marquee-track span:nth-child(3n) { color: var(--accent); font-family: "Iowan Old Style", "Palatino", ui-serif, Georgia, serif; font-style: italic; font-weight: 500; }
  .marquee-track span::after { content: '·'; margin-left: 60px; color: var(--muted-2); }
  @keyframes marquee {
    to { transform: translateX(-50%); }
  }

  .speaker-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border-top: 1px solid var(--rule);
    border-left: 1px solid var(--rule);
  }
  @media (max-width: 900px) { .speaker-grid { grid-template-columns: repeat(2, 1fr); } }
  .speaker-card {
    padding: 28px 24px 100px;
    border-right: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    position: relative;
    aspect-ratio: 1 / 1.15;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    transition: background .3s;
    overflow: hidden;
  }
  .speaker-card:hover { background: var(--tint); }
  .speaker-card .num {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
  .speaker-card .avatar {
    margin-top: 20px;
    width: 100%;
    aspect-ratio: 1;
    max-width: 180px;
    align-self: center;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-soft), var(--rule-soft));
    display: grid;
    place-items: center;
    font-size: 40px;
    font-weight: 600;
    color: var(--accent-ink);
    letter-spacing: -0.03em;
    transition: transform .5s cubic-bezier(.2,.7,.2,1);
  }
  .speaker-card:hover .avatar { transform: scale(1.05); }
  .speaker-card .meta {
    position: absolute;
    bottom: 24px; left: 24px; right: 24px;
  }
  .speaker-card .name {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .speaker-card .role {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }
  .speaker-card .role strong { color: var(--ink); font-weight: 500; }

  /* ============================================================
     FORMATS — horizontal pinned scroll
     ============================================================ */
  #formats-pin-inner {
    background: var(--bg);
    position: relative;
  }
  .fmt-head {

/** Split a headline element on a single line into a wrapper, so it can rise. */
function makeHeadlineLine(rawLine) {
  // Convert {word} to italic accent span
  const processed = rawLine.replace(/\{([^}]+)\}/g, '<span class="accent">$1</span>');
  return `<span class="line"><span>${processed}</span></span>`;
}

/* ============================================================================
   CUSTOM CURSOR
   ============================================================================ */
(function initCursor(){
  if (matchMedia('(hover: none)').matches) return;
  const dot = $('#cursorDot');
  const ring = $('#cursorRing');
  let tx=0, ty=0, dx=0, dy=0, rx=0, ry=0;

  document.addEventListener('mousemove', (e) => { tx=e.clientX; ty=e.clientY; });

  function raf(){
    dx += (tx-dx) * 0.6;
    dy += (ty-dy) * 0.6;
    rx += (tx-rx) * 0.18;
    ry += (ty-ry) * 0.18;
    dot.style.transform = `translate(${dx}px, ${dy}px)`;
    ring.style.transform = `translate(${rx}px, ${ry}px)`;
    requestAnimationFrame(raf);
  }
  raf();

  // Hover states
  document.addEventListener('mouseover', (e) => {
    if (e.target.closest('[data-hover], a, button')) ring.classList.add('hover');
  });
  document.addEventListener('mouseout', (e) => {
    if (e.target.closest('[data-hover], a, button')) ring.classList.remove('hover');
  });
})();

(function initTheme(){
  const root = document.documentElement;
  const btn = $('#themeToggle');
  btn.addEventListener('click', () => {
    const cur = root.getAttribute('data-theme');
    const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = cur ? cur === 'dark' : prefersDark;
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  });
})();

(function heroGradient(){
  const hero = $('#hero');
  const g = $('#heroGradient');
  hero.addEventListener('mousemove', (e) => {
    const r = hero.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * 100;
    const y = ((e.clientY - r.top) / r.height) * 100;
    g.style.setProperty('--mx', x + '%');
    g.style.setProperty('--my', y + '%');

  // CTA glow too

  cta.addEventListener('mousemove', (e) => {
    const r = cta.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * 100;
    const y = ((e.clientY - r.top) / r.height) * 100;
    cg.style.setProperty('--mx', x + '%');
    cg.style.setProperty('--my', y + '%');
  });
})();

/* ============================================================================
   REVEALS + counters
   ============================================================================ */
(function reveals(){
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('in');
        // Counter animation for numbers
        if (e.target.classList.contains('proof-cell')) {
          const el = e.target.querySelector('[data-count]');
          if (el && !el.dataset.done) animateCount(el);
        }
        io.unobserve(e.target);
      }
    });
  }, { rootMargin: '-10% 0px -5% 0px', threshold: 0.05 });

  $$('.reveal, .reveal-stagger').forEach(el => io.observe(el));
  // Also observe proof cells for counters
  $$('.proof-cell').forEach(el => io.observe(el));
})();

function animateCount(el){
  el.dataset.done = '1';
  const raw = el.dataset.count;
  const num = parseFloat(raw.replace(/[^\d.]/g, ''));
  if (!isFinite(num)) return;
  const prefix = raw.match(/^[^\d]*/)[0];
  const suffix = raw.match(/[^\d.]*$/)[0];
  const isFloat = raw.includes('.');
  const dur = 1400;
  const start = performance.now();
  function step(t){
    const p = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    const val = num * eased;
    const formatted = isFloat
      ? val.toFixed(1)
      : Math.round(val).toLocaleString();
    el.textContent = prefix + formatted + suffix;
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============================================================================
   SIDE INDEX — active section tracking
   ============================================================================ */
(function sideIndexActive(){
  const items = $$('#sideindex .idx-item');
  const sections = CONFIG.index.map(i => document.getElementById(i.id)).filter(Boolean);
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const id = e.target.id;
        items.forEach(i => i.classList.toggle('active', i.dataset.target === id));
      }
    });
  }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });
  sections.forEach(s => io.observe(s));
})();

(function audiencePin(){

  function update(){
    const rect = wrap.getBoundingClientRect();
    const total = rect.height - window.innerHeight;
    if (total <= 0) return;
    const p = Math.max(0, Math.min(0.9999, -rect.top / total));
    const idx = Math.min(n - 1, Math.floor(p * n));
    states.forEach((s,i) => {
      s.classList.toggle('active', i === idx);
      $$('.aud-tab', s).forEach((t, j) => t.classList.toggle('active', j === idx));
    });
  }

  // Tab click → jump scroll
  wrap.addEventListener('click', (e) => {
    const btn = e.target.closest('.aud-tab');
    if (!btn) return;
    const j = +btn.dataset.jump;
    const rect = wrap.getBoundingClientRect();
    const total = rect.height - window.innerHeight;
    const targetP = (j + 0.5) / n;
    const targetY = window.scrollY + rect.top + total * targetP;
    window.scrollTo({ top: targetY, behavior: 'smooth' });
  });

  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
})();

/* ============================================================================
   FORMATS — horizontal pinned scroll
   ============================================================================ */
(function formatsPin(){
  const wrap  = $('#formats');
  const track = $('#fmtTrack');
  const fill  = $('#fmtProgressFill');
  const label = $('#fmtProgressLabel');
  const cards = $$('.fmt-card', track);
  const n     = cards.length;

  function update(){
    const rect = wrap.getBoundingClientRect();
    const total = rect.height - window.innerHeight;
    if (total <= 0) return;
    const p = Math.max(0, Math.min(1, -rect.top / total));
    // Horizontal translation: we want to scroll track by its width minus viewport width
    const maxTrans = track.scrollWidth - window.innerWidth + 32;
    track.style.transform = `translateX(${-p * maxTrans}px)`;
    fill.style.width = (p * 100).toFixed(1) + '%';
    const idx = Math.min(n - 1, Math.floor(p * n) + (p >= 1 ? -1 : 0));
    label.textContent = `${String(Math.max(1, idx+1)).padStart(2,'0')} / ${String(n).padStart(2,'0')}`;
  }
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
})();

(function testiPin(){

/* ============================================================================
   TIERS — stacking card scroll
   ============================================================================ */
(function tiersPin(){
  const wrap = $('#tiers');
  const cards = $$('.tier-card', wrap);
  const dots = $$('.tier-dot', wrap);
  const n = cards.length;

  function update(){
    const rect = wrap.getBoundingClientRect();
    const total = rect.height - window.innerHeight;
    if (total <= 0) return;
    const p = Math.max(0, Math.min(1, -rect.top / total));
    // Each card takes 1/n of scroll. Focus card = floor(p*n)
    const focus = Math.min(n - 1, Math.floor(p * n));
    // sub-progress within current focus
    const sub = Math.max(0, Math.min(1, p * n - focus));

    cards.forEach((c, i) => {
      let dy, scale, opacity;
      if (i < focus) {
        // already passed — pushed up out of view
        dy = -180 - (focus - i) * 20;
        scale = 0.92 - (focus - i) * 0.02;
        opacity = 0;
      } else if (i === focus) {
        // active card — slides up as sub progresses
        dy = 40 - sub * 200;
        scale = 1 - sub * 0.05;
        opacity = 1 - sub * 0.5;
      } else {
        // upcoming stack behind current
        const offset = i - focus;
        // stack peeks: further back the deeper
        dy = 40 + offset * 40 - sub * 40;
        scale = 1 - offset * 0.05;
        opacity = 1;
      }
      c.style.zIndex = (n - Math.abs(i - focus));
      c.style.transform = `translate(-50%, ${dy}px) scale(${scale})`;
      c.style.opacity = Math.max(0, opacity);
    });

    dots.forEach((d, i) => d.classList.toggle('active', i === focus));
  }

  wrap.addEventListener('click', (e) => {
    const btn = e.target.closest('.tier-dot');
    if (!btn) return;
    const j = +btn.dataset.tier;
    const rect = wrap.getBoundingClientRect();
    const total = rect.height - window.innerHeight;
    const targetP = (j + 0.3) / n;
    const targetY = window.scrollY + rect.top + total * targetP;
    window.scrollTo({ top: targetY, behavior: 'smooth' });
  });

  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
})();
</script>
